# ${NAS_SHARE} viene sostituito da ./apply-manual.sh leggendo .env. Questo file
# non e' applicabile cosi' com'e', ed e' voluto: l'indirizzo della share non
# entra in un repo pubblico.
#
# Due PV sulla STESSA share: cambia il verso (ro / rw), non il comportamento in
# caso di guasto -- entrambi sono soft.
#
#   pv-photos-nas-ro   api, dedup, label
#   pv-photos-nas-rw   scan (l'unico che scrive)
#
# soft esplicito su entrambi: un NAS che non risponde deve dare EIO, non
# bloccare la syscall per sempre. Un blocco sull'API porterebbe giu' anche
# /api/browse, che tocca solo Postgres; un blocco sullo scan lascerebbe il pod
# appeso e, con concurrencyPolicy: Forbid, nessuna scansione partirebbe piu'.
#
# ATTENZIONE: "timeo" NON e' un'opzione cifs, e' NFS. Metterla fa fallire il
# mount con "mount error(22): Invalid argument", e l'errore non dice quale
# opzione sia sbagliata. Verificato sul cluster.
#
# NOTA: il provisioning dinamico (solo PVC) non funziona sulle share in sola
# lettura — il driver CSI deve creare una sottodirectory al momento del
# provision. Servono PV+PVC statici, con storageClassName vuoto e volumeName
# esplicito.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-photos-nas-ro
  labels:
    app: photovault
spec:
  capacity:
    storage: 2Ti   # nominale, SMB non impone quote
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""   # vuoto: scavalca il provisioner, si lega al PVC sotto
  mountOptions:
    - ro
    - soft          # un NAS che non risponde da EIO, non un blocco eterno
    - actimeo=60    # cache degli attributi: la libreria cambia una volta al giorno
    - dir_mode=0555
    - file_mode=0444
    - uid=1000
    - gid=1000
    - noperm
    - mfsymlinks
    - cache=strict
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    readOnly: true
    volumeHandle: nasphotos-pv-ro   # deve essere unico nel cluster
    volumeAttributes:
      source: "${NAS_SHARE}"
    nodeStageSecretRef:
      # I PV sono cluster-scoped: il riferimento a un secret di un altro
      # namespace e' lecito. Questo secret esiste gia' nel cluster.
      name: nascreds-ro
      namespace: default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-photos-nas-ro
  namespace: photovault
  labels:
    app: photovault
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  resources:
    requests:
      storage: 2Ti
  volumeName: pv-photos-nas-ro
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-photos-nas-rw
  labels:
    app: photovault
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    # soft anche in scrittura, esplicito per non dipendere dal default.
    # Un hard mount qui bloccherebbe il pod scan per sempre se il NAS sparisce,
    # e con concurrencyPolicy: Forbid non partirebbe piu' nessuna scansione, in
    # silenzio. Con soft il job va in errore e si vede nella pagina Job.
    # Le write parziali non sono un rischio: le thumbnail si scrivono su file
    # temporaneo e poi rename, e il cestino e' solo una rename.
    - soft
    - dir_mode=0755
    - file_mode=0644
    - uid=1000
    - gid=1000
    - noperm
    - mfsymlinks
    - cache=strict
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: nasphotos-pv-rw   # deve essere unico nel cluster
    volumeAttributes:
      source: "${NAS_SHARE}"
    nodeStageSecretRef:
      name: nascreds-rw
      namespace: default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-photos-nas-rw
  namespace: photovault
  labels:
    app: photovault
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 2Ti
  volumeName: pv-photos-nas-rw
