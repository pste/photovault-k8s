# Etichettatura. Oggi esegue un job solo, "places": i toponimi dal GPS EXIF e
# dal nome delle cartelle, che non hanno bisogno di thumbnail ne' di modelli --
# solo del file GeoNames che sta dentro l'immagine.
#
# I tag di scena con CLIP arriveranno come secondo job, con la loro coda
# (label_status) e le variabili di ONNX Runtime, che si aggiungono qui quando
# servono davvero: una configurazione che non fa niente e' peggio di una
# mancante, perche' sembra attiva.
#
# Alle 03:30, dopo lo scan delle 02:00. Lo sfalsamento non esclude la
# sovrapposizione con thumbs, che con un arretrato gira per giorni: i luoghi
# pero' finiscono in secondi.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: photovault-label
  namespace: photovault
  labels:
    app: photovault
    component: label
spec:
  schedule: "30 3 * * *"
  # Senza, il controller legge gli orari in UTC: "0 2" partiva alle 3 o alle
  # 4 italiane, e tutti gli orari nei commenti erano sbagliati di 1-2 ore.
  timeZone: "Europe/Rome"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # I luoghi dell'archivio intero richiedono minuti: due ore sono un
      # blocco, e senza limite il Forbid fermerebbe questo CronJob per sempre.
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: photovault
            component: label
        spec:
          restartPolicy: Never
          containers:
            - name: label
              image: pirraste/photovault-label:v0
              env:
                - name: TZ
                  value: "Europe/Rome"
                - name: LOG_LEVEL
                  value: "info"
                - name: API_URL
                  value: "http://api-svc.photovault.svc.cluster.local:80"
                - name: API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: photovault-secrets
                      key: TOKEN
                # Nessun MEDIA_ROOT: i luoghi non leggono un solo file dalla
                # share. Tornera' con CLIP, che lavora sulle thumbnail "m".
                - name: LABEL_BATCH
                  value: "500"
                - name: ENQUEUE_ON_START
                  value: "places"
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          # Nessun volume: il job dei luoghi non tocca la share. Il mount in
          # sola lettura torna con CLIP, che legge le thumbnail "m".
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
