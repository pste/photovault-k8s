apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Due cartelle NON sono qui dentro, e per due motivi diversi:
#
#   k8s/secrets/  e' cifrato con SOPS, e ArgoCD non sa decifrarlo
#   k8s/manual/   ha dei segnaposto ${...}, e ArgoCD non esegue envsubst
#
# Entrambe si applicano a mano. Tutto il resto e' GitOps.
resources:
- namespace.yaml
- postgres.yaml
- services.yaml
- api.yaml
- ui.yaml
- cronjob-scan.yaml
- cronjob-dedup.yaml
- cronjob-label.yaml

images:
- name: pirraste/photovault-api
  newTag: v0.1.9
- name: pirraste/photovault-dedup
  newTag: v0.1.2
- name: pirraste/photovault-label
  newTag: v0.1.1
- name: pirraste/photovault-scan
  newTag: v0.2.0
- name: pirraste/photovault-ui
  newTag: v0.1.7
