apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# k8s/secrets/ NON e' qui dentro di proposito: e' cifrato con SOPS e ArgoCD non
# sa decifrarlo. Si applica a mano, ed e' l'unica cosa che si applica a mano.
resources:
- namespace.yaml
- storage.yaml
- postgres.yaml
- services.yaml
- ingress.yaml
- api.yaml
- ui.yaml
- cronjob-scan.yaml
- cronjob-dedup.yaml
- cronjob-label.yaml

images:
- name: pirraste/photovault-api
  newTag: v0.1.1
- name: pirraste/photovault-dedup
  newTag: v0.1.0
- name: pirraste/photovault-label
  newTag: v0
- name: pirraste/photovault-scan
  newTag: v0.1.0
- name: pirraste/photovault-ui
  newTag: v0.1.0
