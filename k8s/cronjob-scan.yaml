# Due CronJob, stessa immagine, due compiti diversi.
#
# - scan-queue  svuota la coda dei job leggeri: trashapply, che l'API accoda
#               quando l'utente cestina, e livephoto. Senza, cestinare una foto
#               resterebbe senza effetto visibile fino alla notte successiva.
# - scan-nightly mette in coda la scansione vera e la pulizia del cestino, ed
#               e' l'unico che esegue scan e thumbs.
#
# I due si sovrappongono di sicuro: thumbs, con un arretrato, gira per giorni,
# e concurrencyPolicy: Forbid impedisce solo a un CronJob di sovrapporsi a se
# stesso. Per questo scan-queue ha JOBS: senza, se trovava thumbs in coda si
# metteva a generare anteprime accanto al notturno, con un secondo limite da
# 1 GiB su un nodo dove un OOM porta giu' il cluster, non un pod. Con JOBS non
# decodifica niente, e 256Mi gli bastano.
#
# Conseguenza voluta: una scansione chiesta dalla UI parte col notturno.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: photovault-scan-queue
  namespace: photovault
  labels:
    app: photovault
    component: scan
spec:
  suspend: false
  schedule: "7,22,37,52 * * * *"
  # Senza, il controller legge gli orari in UTC: "0 2" partiva alle 3 o alle
  # 4 italiane, e tutti gli orari nei commenti erano sbagliati di 1-2 ore.
  timeZone: "Europe/Rome"
  concurrencyPolicy: Forbid
  # Senza, un controller rimasto fermo che accumula oltre 100 orari mancati
  # smette di schedulare questo CronJob per sempre.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Un cestino si svuota in secondi. Un pod appeso oltre la mezz'ora
      # terrebbe fermo questo CronJob per sempre, per via del Forbid.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: photovault
            component: scan
        spec:
          restartPolicy: Never
          containers:
            - name: scan
              image: pirraste/photovault-scan:v0
              env:
                - name: TZ
                  value: "Europe/Rome"
                - name: LOG_LEVEL
                  value: "info"
                - name: API_URL
                  value: "http://api-svc.photovault.svc.cluster.local:80"
                - name: API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: photovault-secrets
                      key: TOKEN
                - name: MEDIA_ROOT
                  value: "/data/photos"
                - name: SCAN_WORKERS
                  value: "3"
                # Obbligatorio: il GC di Go non conosce i limiti cgroup e
                # cresce oltre il limite del pod finche' non viene OOMKillato
                # a meta' lavoro. Va tenuto sotto al limits.memory qui sotto.
                - name: GOMEMLIMIT
                  value: "200MiB"
                # Nessun accodamento: questo pod si limita a smaltire quello
                # che ha gia' messo in coda l'API.
                - name: ENQUEUE_ON_START
                  value: ""
                # Solo job che non decodificano immagini: e' questo che rende
                # sicuro il limite di memoria qui sotto (vedi in cima al file).
                - name: JOBS
                  value: "trashapply,livephoto"
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 256Mi
              volumeMounts:
                - name: smb
                  mountPath: /data/photos
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            # L'unico mount in SCRITTURA di tutto photovault: thumbnail e
            # cestino. E' soft mount (vedi k8s/manual/storage.yaml): un NAS
            # che non risponde deve dare EIO, non appendere il pod. Le write
            # parziali non sono un rischio, perche' le thumbnail si scrivono
            # su file temporaneo e poi rename, e il cestino e' solo una rename.
            - name: smb
              persistentVolumeClaim:
                claimName: pvc-photos-nas-rw
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: photovault-scan-nightly
  namespace: photovault
  labels:
    app: photovault
    component: scan
spec:
  suspend: false
  schedule: "0 2 * * *"
  # Senza, il controller legge gli orari in UTC: "0 2" partiva alle 3 o alle
  # 4 italiane, e tutti gli orari nei commenti erano sbagliati di 1-2 ore.
  timeZone: "Europe/Rome"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  # Nessun activeDeadlineSeconds, per scelta: thumbs con un arretrato gira
  # legittimamente per giorni. Contro i blocchi veri ci sono i tempi massimi
  # su ffmpeg, ffprobe e heif-convert dentro il pod.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: photovault
            component: scan
        spec:
          restartPolicy: Never
          containers:
            - name: scan
              image: pirraste/photovault-scan:v0
              env:
                - name: TZ
                  value: "Europe/Rome"
                - name: LOG_LEVEL
                  value: "info"
                - name: API_URL
                  value: "http://api-svc.photovault.svc.cluster.local:80"
                - name: API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: photovault-secrets
                      key: TOKEN
                - name: MEDIA_ROOT
                  value: "/data/photos"
                - name: SCAN_WORKERS
                  value: "3"
                - name: GOMEMLIMIT
                  value: "800MiB"
                # La scansione accoda "thumbs" da sola quando finisce, e la
                # esegue nello stesso run: qui non va ripetuta.
                - name: ENQUEUE_ON_START
                  value: "scan,trashpurge"
                # Root creata al primo avvio se non ne esiste nessuna.
                # Il percorso e' relativo a MEDIA_ROOT: vuoto = radice share.
                - name: ROOT_NAME
                  value: "Foto"
                - name: ROOT_REL_PATH
                  value: ""
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
              volumeMounts:
                - name: smb
                  mountPath: /data/photos
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: smb
              persistentVolumeClaim:
                claimName: pvc-photos-nas-rw
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
