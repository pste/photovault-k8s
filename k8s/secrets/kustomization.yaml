apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applicata a mano, MAI da ArgoCD: questi file sono cifrati con SOPS e ArgoCD
# non sa decifrarli. E' l'unica parte del deploy che non e' GitOps, ed e'
# anche l'unica che lo giustifica.
#
# I file non esistono in chiaro finche' non si lancia ./decrypt.sh.
resources:
  - secrets.yaml
  - secrets-pg.yaml
