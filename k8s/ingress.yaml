# ATTENZIONE: photovault.<dominio> e' un segnaposto. Va sostituito con
# l'hostname vero in due punti (tls.hosts e rules.host) prima di applicare.
#
# I Service (ui-svc, api-svc) stanno in k8s/services.yaml.
#
# Nessun record DNS da creare se il dominio e' gia' gestito da un wildcard.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: photovault-ingress
  namespace: photovault
  labels:
    app: photovault
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - photovault.<dominio>
      secretName: photovault-tls
  rules:
    - host: photovault.<dominio>
      http:
        paths:
          # /api prima di /: con pathType Prefix Traefik ordina per lunghezza
          # del percorso, ma tenerli in quest'ordine rende evidente l'intento.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui-svc
                port:
                  number: 80
