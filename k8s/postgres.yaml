apiVersion: v1
kind: PersistentVolume
metadata:
  name: photovault-postgres-volume
  labels:
    app: photovault
    component: postgres
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    # Directory dedicata: condividerla con un altro Postgres significherebbe
    # due processi sulla stessa PGDATA, che e' corruzione garantita.
    path: /var/mnt/hdd-data-1/photovault-postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photovault-postgres-claim
  namespace: photovault
  labels:
    app: photovault
    component: postgres
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: photovault-postgres-volume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: photovault
  labels:
    app: photovault
    component: postgres
spec:
  replicas: 1
  strategy:
    # Il PV e' ReadWriteMany ma PGDATA non lo e': con RollingUpdate il pod
    # nuovo monterebbe la stessa directory del vecchio prima che questo esca.
    type: Recreate
  selector:
    matchLabels:
      app: photovault
      component: postgres
  template:
    metadata:
      labels:
        app: photovault
        component: postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        # Gira come root prima che postgres parta. Il hostPath appartiene a
        # root e postgres (uid 999) non puo' scriverci. Su Talos non c'e' SSH
        # per fare il chown sul nodo, quindi lo fa un initContainer.
        - name: fix-permissions
          image: busybox:1.36
          command: ['sh', '-c', 'chown -R 999:999 /var/lib/postgresql/data']
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgresdata
      containers:
        - name: postgres
          # Stessa versione usata in sviluppo. bit_count() e' core dalla 14:
          # e' il presupposto della scelta dhash bit(64) nel dedup.
          image: 'postgres:14'
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
          env:
            - name: TZ
              value: "Europe/Rome"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: photovault-pgcreds
                  key: PGDATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: photovault-pgcreds
                  key: PGUSER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photovault-pgcreds
                  key: PGPASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "2"
              memory: 768Mi
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres']
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgresdata
      volumes:
        - name: postgresdata
          persistentVolumeClaim:
            claimName: photovault-postgres-claim
