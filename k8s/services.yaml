apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: photovault
  labels:
    app: photovault
    component: postgres
spec:
  type: ClusterIP
  selector:
    app: photovault
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: ui-svc
  namespace: photovault
  labels:
    app: photovault
    component: ui
spec:
  type: ClusterIP
  selector:
    app: photovault
    component: ui
  ports:
    - protocol: TCP
      port: 80
      # nginx-unprivileged non gira da root: ascolta sulla 8080.
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: photovault
  labels:
    app: photovault
    component: api
spec:
  type: ClusterIP
  selector:
    app: photovault
    component: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
